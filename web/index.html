<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOP · Live Object-Oriented Playground</title>
    <meta name="description" content="Learn Python object-oriented programming by watching real code run.">
    <link rel="icon" type="image/png" sizes="32x32" href="images/loop-favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/loop-favicon-16.png">
    <link rel="apple-touch-icon" href="images/loop-apple-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/playground.css">

    <!-- Hide the hero text until typewriter.js starts typing it, so the full text never flashes first.
         The timeout shows the text anyway if the script never arrives. -->
    <script>
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            document.documentElement.classList.add("typewriter-pending");
            window.setTimeout(() => document.documentElement.classList.remove("typewriter-pending"), 3000);
        }
    </script>
</head>
<body>
<div class="page">

    <!-- =========================
         Hero
         ========================= -->

    <header class="hero">
        <span class="brand">LOOP</span>

        <div class="hero-copy">
            <h1 data-typewriter="heading">See Python objects at work.</h1>
            <p data-typewriter="description">LOOP runs real Python object-oriented code and shows you what each line does: which object runs, which method it calls, and what changes.</p>
            <!-- Same path as the arrowDown icon in icons.js, written inline so it shows before the scripts run. -->
            <a class="hero-scroll" href="#playground" aria-label="Jump to the Playground" title="Jump to the Playground">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>
            </a>
        </div>

        <!-- A small picture of the Cybersecurity scenario: the objects, methods and calls match scenarios/cybersecurity. -->
        <!-- hero.js draws the routes between the methods and plays the two calls once. -->
        <figure class="hero-diagram" id="hero-diagram" role="img"
                aria-label="attacker.launch(malware, device_a) calls malware.execute, which calls device_a.infect, so infected changes from False to True. Then victim.isolate(device_a) calls device_a.disconnect, so online changes from True to False.">
            <svg class="hero-lines" id="hero-lines" aria-hidden="true"></svg>

            <div class="hero-actors">
                <div class="hero-actor" data-panel="1">
                    <span class="hero-role">Attacker</span>
                    <div class="hero-object">
                        <span class="hero-object-name">attacker<span>: Attacker</span></span>
                        <span class="hero-method" data-method="Attacker.launch">launch()</span>
                    </div>
                    <div class="hero-object">
                        <span class="hero-object-name">malware<span>: MalwareAttack</span></span>
                        <span class="hero-method" data-method="MalwareAttack.execute">execute()</span>
                    </div>
                </div>

                <div class="hero-actor" data-panel="2">
                    <span class="hero-role">Device</span>
                    <div class="hero-object">
                        <span class="hero-object-name">device_a<span>: Device</span></span>
                        <span class="hero-method" data-method="Device.infect">infect()</span>
                        <span class="hero-method" data-method="Device.disconnect">disconnect()</span>
                        <dl class="hero-state">
                            <dt>online</dt><dd data-state="online">True</dd>
                            <dt>infected</dt><dd data-state="infected">False</dd>
                        </dl>
                    </div>
                </div>

                <div class="hero-actor" data-panel="3">
                    <span class="hero-role">Victim</span>
                    <div class="hero-object">
                        <span class="hero-object-name">victim<span>: Victim</span></span>
                        <span class="hero-method" data-method="Victim.isolate">isolate()</span>
                    </div>
                </div>
            </div>

            <p class="hero-call"><span>&gt;&gt;&gt;</span> <code id="hero-call">attacker.launch(malware, device_a)</code></p>
        </figure>
    </header>


    <!-- =========================
         OOP Fundamentals (placeholder)
         ========================= -->

    <section class="fundamentals" aria-labelledby="fundamentals-title">
        <h2 id="fundamentals-title">OOP fundamentals</h2>
        <div class="concept-grid" id="concept-grid"></div>
    </section>


    <!-- =========================
         Playground
         ========================= -->

    <!-- Scenario tabs, actor panels and Terminal cards are filled in by the scripts below. -->
    <main class="playground" id="playground">
        <nav class="scenario-tabs" id="scenario-tabs" role="tablist" aria-label="Scenarios"></nav>

        <section class="controls" aria-label="Playback">
            <div class="button-group">
                <button class="playback-button" id="playback-play" type="button" disabled>Play</button>
                <button class="playback-button" id="playback-pause" type="button" disabled>Pause</button>
                <button class="playback-button" id="playback-previous" type="button" disabled>Previous</button>
                <button class="playback-button" id="playback-next" type="button" disabled>Next</button>
                <button class="playback-button" id="playback-replay" type="button" disabled
                        title="Show the same run again. The code is not executed a second time.">Replay</button>
            </div>
            <button class="playback-button" id="playback-reset" type="button"
                    title="Recreate every object with its starting values.">Reset</button>
            <span class="playback-progress" id="playback-progress">Step 0 / 0</span>
            <button class="text-button" id="toggle-lines" type="button" aria-pressed="false">Show line numbers</button>
        </section>

        <section class="terminal" aria-labelledby="terminal-title">
            <div class="section-header">
                <h2 class="section-title" id="terminal-title">Terminal</h2>
                <code class="terminal-call" id="terminal-call"></code>
            </div>
            <div class="terminal-log" id="terminal-log" role="log" aria-live="polite"></div>
        </section>

        <!-- The circuit layer and target picker float over the panels, so they never move the code. -->
        <section class="actor-space" id="actor-space" aria-label="Actor panels">
            <svg class="circuit-layer" id="circuit-layer" aria-hidden="true"></svg>
            <div class="target-picker" id="target-picker" role="dialog" aria-label="Choose a target" hidden></div>
        </section>
    </main>

    <footer>
        <span id="system-status">Loading…</span>
    </footer>
</div>


<!-- =========================
     Scripts
     ========================= -->

<!-- The scripts share functions, so order matters: data and helpers first, app.js last because it starts the page. -->
<script src="js/typewriter.js"></script>
<script src="js/concepts.js"></script>
<script src="js/icons.js"></script>
<script src="js/panels.js"></script>
<script src="js/routes.js"></script>
<script src="js/hero.js"></script>
<script src="js/terminal.js"></script>
<script src="js/playback.js"></script>
<script src="js/app.js"></script>
</body>
</html>
